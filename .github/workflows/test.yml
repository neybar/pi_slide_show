name: Tests

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.beads/**'
      - '.claude/**'
      - '.cursor/**'
      - '.codex/**'
      - '.agents/**'
      - 'scripts/check-agent-docs.sh'
      - '.github/workflows/agent-docs.yml'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.beads/**'
      - '.claude/**'
      - '.cursor/**'
      - '.codex/**'
      - '.agents/**'
      - 'scripts/check-agent-docs.sh'
      - '.github/workflows/agent-docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR/feature runs; never cancel master runs (docker-publish publishes there).
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

# Note: Docker performance tests (npm run test:perf:docker) are local-only.
# They require Docker with NFS-mounted photos and Synology thumbnails.
# These tests are skipped in CI and should be run manually during development.

jobs:
  # Fast unit tests - runs on all PRs and pushes
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # www/ too: the jsdom unit tests load the browser's jQuery from www/node_modules
        run: npm ci && npm ci --prefix www

      - name: Check www/ browser compatibility (browserslist target)
        run: npm run lint:compat

      - name: Run unit tests
        run: npm run test:unit

  # Performance tests - runs in parallel with unit tests
  perf-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    # Only run on main branch pushes to save CI time on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npm run test:perf

  # E2E tests - only on main branch to save time and GitHub Actions minutes
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # Only run on main branch pushes to save CI time on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix www

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Experimental: Lightpanda E2E — informational only, never blocks merges
  lightpanda-e2e:
    name: E2E Tests (Lightpanda - Experimental)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    continue-on-error: true
    services:
      lightpanda:
        image: lightpanda/browser:nightly
        ports:
          - 9222:9222

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix www

      - name: Run Lightpanda E2E tests
        run: npm run test:e2e:lightpanda

      - name: Upload Lightpanda report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightpanda-report
          path: playwright-report/
          retention-days: 7

  # Runtime check in the real display browser (Chromium 76), not just the static lint:compat.
  # Native amd64 here; the Dockerfile and docker-compose.yml are in test/chrome76/.
  chrome76:
    name: Chrome 76 runtime (Docker)
    runs-on: ubuntu-latest
    env:
      # Celeron 2955U (1.4 GHz Haswell) vs a ~3 GHz runner core with newer IPC: roughly 2.5-3x
      # slower per thread. 3 is an estimate, not a measurement; see AGENTS.md.
      CHROME76_CPU_THROTTLE: '3'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (the app container mounts them)
        run: npm ci --omit=dev && npm ci --omit=dev --prefix www

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Chromium 76 image (layers cached in the Actions cache)
        uses: docker/build-push-action@v6
        with:
          context: test/chrome76
          load: true
          tags: pi-slideshow-chrome76
          cache-from: type=gha,scope=chrome76
          cache-to: type=gha,scope=chrome76,mode=max

      - name: Run the Chrome 76 suite
        run: CHROME76_SKIP_BUILD=1 npm run test:chrome76

      - name: Upload screenshots and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome76-screenshots
          path: test-results/chrome76/
          retention-days: 7
