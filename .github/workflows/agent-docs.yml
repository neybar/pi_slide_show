name: Agent docs

# No paths-ignore: doc-only changes are exactly what can undo the layout.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    name: Agent-doc layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-agent-docs.sh
