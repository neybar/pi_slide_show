<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.auto { cursor: none; }
  #stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; background: #000; }
  .backdrop { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .backdrop_layer { position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: scale(1.1); pointer-events: none; }
  .backdrop_layer canvas { display: block; width: 100%; height: 100%; object-fit: cover; }
  .backdrop_overlay { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #000; pointer-events: none; }
  .layer { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .box { position: absolute; transform-origin: 0 0; will-change: transform; }
  .box img { display: block; width: 100%; height: 100%; max-width: none; object-fit: contain; }
  .frame .box:not(.is-hero) { border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); box-sizing: border-box; overflow: hidden; }
  .name { position: fixed; left: 24px; z-index: 5; color: #fff; font-size: 28px; mix-blend-mode: difference; pointer-events: none; }
  .name.top { top: 16px; } .name.bottom { bottom: 16px; }
  #label { position: fixed; z-index: 20; top: 12px; left: 12px; right: 12px; font-size: 44px; font-weight: 700; color: #fff;
    text-shadow: 0 0 6px #000, 0 0 12px #000; pointer-events: none; text-align: center; }
  #hud { position: fixed; z-index: 20; right: 12px; bottom: 12px; padding: 10px 16px; background: rgba(0, 0, 0, 0.75);
    color: #7f7; font: 26px/1.3 ui-monospace, Menlo, Consolas, monospace; white-space: pre; pointer-events: none; }
  #hud.tl { left: 12px; top: 80px; right: auto; bottom: auto; }
  #hud.tr { right: 12px; top: 80px; bottom: auto; }
  #summary { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; background: #000; color: #fff; padding: 24px 40px;
    font: 28px/1.35 ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
  #summary h1 { font: 700 44px sans-serif; margin: 0 0 16px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="label"></div>
<div id="hud" hidden></div>
<script type="module" src="hero.mjs"></script>
</body>
</html>
