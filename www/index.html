<!DOCTYPE html>
<html lang="en" class="no-js">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <!-- Meta refresh at 2 h (7200s) is the last-resort net, for when JS has died. -->
        <!-- It cannot check the server first: a refresh while the server is down leaves Chrome on its error page, and the kiosk has no keyboard. -->
        <!-- So the routine 20 min reload is a JS timer (PAGE_RELOAD_MS in www/js/config.mjs) that goes through safeReload (www/js/safe-reload.mjs), which probes the server first. -->
        <!-- JS album transitions happen when an album's play time ends: 15 min for grid albums (ALBUM_DURATION_MS), less for single and tiny albums. -->
        <meta http-equiv="refresh" content="7200">
        <title>Photo Slideshow</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="node_modules/purecss/build/pure-min.css">
        <link rel="stylesheet" href="css/main.css">

        <script src="node_modules/underscore/underscore-umd-min.js"></script>
        <script src="node_modules/jquery/dist/jquery.min.js"></script>
        <script src="node_modules/jquery-ui-dist/jquery-ui.min.js"></script>
    </head>
    <body class="mode-grid">
        <div id="content">
            <div class="shelf">
                <div class="pure-g" id="top_row">
                </div>
            </div>
            <div class="shelf">
                <div class="pure-g" id="bottom_row">
                </div>
            </div>
            <!-- Single and tiny albums: backdrop behind one layer of absolutely positioned img_boxes -->
            <div id="hero_stage">
                <div class="hero_backdrop"></div>
                <div class="hero_layer"></div>
            </div>
            <div class="album_name"></div>
        </div>
        <div id="photo_store">
            <div id="landscape"></div>
            <div id="portrait"></div>
            <div id="panorama"></div>
        </div>


        <script type="module" src="js/config.mjs"></script>
        <script type="module" src="js/utils.mjs"></script>
        <script type="module" src="js/photo-store.mjs"></script>
        <script type="module" src="js/prefetch.mjs"></script>
        <script type="module" src="js/safe-reload.mjs"></script>
        <script type="module" src="js/backdrop.mjs"></script>
        <script type="module" src="js/album-mode.mjs"></script>
        <script type="module" src="js/filmstrip.mjs"></script>
        <script type="module" src="js/watchdog.mjs"></script>
        <script type="module" src="js/diagnostics.mjs"></script>
        <script defer src="js/main.js"></script>
    </body>
</html>
